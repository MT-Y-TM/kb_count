[package]
name = "kb_count"
version = "0.1.0"
edition = "2024"
authors = ["kb_count"]
description = "Portable Windows keyboard and mouse usage statistics"
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
slint = "1.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

[build-dependencies]
slint-build = "1.9"





